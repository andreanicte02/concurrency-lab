name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - run: mvn -B verify
      - run: |
          gh release create "$GITHUB_REF_NAME" target/concurrency-lab.jar \
            --title "$GITHUB_REF_NAME" \
            --notes "Run with Java 21+: \`java -jar concurrency-lab.jar all\`"
        env:
          GH_TOKEN: ${{ github.token }}
